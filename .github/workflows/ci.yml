name: build-and-test

on:
  push:
  pull_request:

jobs:
  windows-msvc:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Configure (MSVC, /W4 /WX)
        run: cmake -S . -B build -A x64 -DSOFTPRAC_WERROR=ON
      - name: Build
        # エラーと警告だけを表示する（失敗したプロジェクトを見つけやすくする）
        run: cmake --build build --config Debug -- /m /nologo "/clp:ErrorsOnly;WarningsOnly;Summary"
      - name: Test
        run: ctest --test-dir build -C Debug --output-on-failure

  linux:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        cc: [gcc, clang]
    steps:
      - uses: actions/checkout@v4
      - name: Install Ninja
        run: sudo apt-get update && sudo apt-get install -y ninja-build
      - name: Configure (warnings as errors, ASan/UBSan)
        run: cmake -S . -B build -G Ninja -DCMAKE_C_COMPILER=${{ matrix.cc }} -DSOFTPRAC_WERROR=ON -DSOFTPRAC_SANITIZE=ON
      - name: Build
        run: cmake --build build
      - name: Test
        run: ctest --test-dir build --output-on-failure

  macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Configure / Build / Test (preset)
        run: |
          cmake --preset gcc-debug -DSOFTPRAC_WERROR=ON
          cmake --build --preset gcc-debug
          ctest --preset gcc-debug

  repository-checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: File names are valid on Windows
        run: |
          git ls-files | python3 -c "
          import re, sys
          bad = [l for l in sys.stdin.read().splitlines()
                 if re.search(r'(^|/)(con|prn|aux|nul|com[0-9]|lpt[0-9])(\.[^/]*)?(/|$)', l, re.I)
                 or re.search(r'[<>:\"|?*\\\\]', l) or re.search(r'[ .](/|$)', l)]
          print('\n'.join(bad)); sys.exit(1 if bad else 0)"
      - name: Sources are UTF-8 with BOM and LF
        run: python3 tools/normalize_sources.py --check
      - name: .vs/launch.vs.json and README index are up to date
        run: |
          python3 tools/gen_launch_vs.py
          python3 tools/gen_readme_index.py
          git diff --exit-code -- .vs/launch.vs.json README.md
