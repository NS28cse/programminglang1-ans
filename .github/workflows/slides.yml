name: slides

# README.md 以外の .md（Slidev のスライド。テーマごとに 1 つ）をすべて HTML と PDF に書き出す。
# slides ブランチへの push では GitHub Pages に公開し，PR では成果物（Artifacts の slides）にする。
# 公開には Settings > Pages の Source を GitHub Actions にし，github-pages 環境で slides ブランチからの公開を許可しておく（README.md の「公開のしくみ」）
on:
  push:
    branches: [slides]
  pull_request:
  workflow_dispatch:

# PR は新しい push で古い実行を取り消す。slides への push（公開）は取り消さない
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - name: Install
        run: npm ci
      - name: Japanese fonts and Chromium for the PDF export
        # apt のミラーが応答しないと止まったままになるので，この手順だけ時間を区切り，取得を再試行する
        timeout-minutes: 8
        run: |
          sudo apt-get update -q -o Acquire::Retries=3
          sudo apt-get install -y -q -o Acquire::Retries=3 fonts-noto-cjk
          npx playwright install --with-deps chromium
      - name: Build HTML and export PDF
        # HTML は相対パス（--base ./）と hash ルーター（各スライドの routerMode: hash）にして，
        # どの URL に置いても，途中のスライドで再読み込みしても動くようにする
        run: |
          mkdir -p dist
          for file in *.md; do
            [ "$file" = README.md ] && continue
            deck="${file%.md}"
            npx slidev build "$file" --base ./ --out "dist/$deck"
            npx slidev export "$file" --output "dist/$deck.pdf"
          done
      - name: Index page
        run: |
          python3 - <<'EOF'
          import html, pathlib, re
          items = []
          for md in sorted(pathlib.Path(".").glob("*.md")):
              if md.name == "README.md":
                  continue
              text = md.read_text(encoding="utf-8")
              m = re.search(r"^title: (.+)$", text, re.M)
              title = html.escape(m.group(1) if m else md.stem)
              # info: の 1 行目（「関係する回: …」）を一覧に添える
              w = re.search(r"^info: \|\n\s+(.+)$", text, re.M)
              weeks = f'<br><small>{html.escape(w.group(1))}</small>' if w else ""
              items.append(f'<li>{title}（<a href="{md.stem}/">スライド</a>・<a href="{md.stem}.pdf">PDF</a>）{weeks}</li>')
          pathlib.Path("dist/index.html").write_text(
              '<!doctype html><html lang="ja"><meta charset="utf-8">'
              '<meta name="viewport" content="width=device-width, initial-scale=1">'
              '<title>説明用スライド</title>'
              '<h1>説明用スライド</h1>'
              '<p>プログラミング言語I・ソフトウェア演習I の演習中に，TA が 1 対 1 で説明するときに使うスライド（テーマごと）</p>'
              '<ul>' + "".join(items) + '</ul></html>\n', encoding="utf-8")
          EOF
      - uses: actions/upload-artifact@v7
        with:
          name: slides
          path: dist
      - name: Upload for GitHub Pages
        if: github.ref == 'refs/heads/slides' && github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v5
        with:
          path: dist

  deploy:
    needs: build
    if: github.ref == 'refs/heads/slides' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    # 公開の途中で取り消さない（続けて push したときは，前の公開が終わってから次を公開する）
    concurrency:
      group: pages
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
