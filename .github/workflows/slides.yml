name: slides

# slides/ の説明用スライド（Slidev。README.md 以外の .md をすべて）を HTML と PDF に書き出し，成果物（Artifacts の slides）にする。
# ta ブランチでは，リポジトリ変数 SLIDES_PAGES が true のとき GitHub Pages にも公開する（設定は slides/README.md の「GitHub Pages」）
on:
  push:
    paths: ['slides/**', '.github/workflows/slides.yml']
  pull_request:
    paths: ['slides/**', '.github/workflows/slides.yml']
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: slides
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: slides/package-lock.json
      - name: Install
        run: npm ci
      - name: Japanese fonts and Chromium for the PDF export
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q fonts-noto-cjk
          npx playwright install --with-deps chromium
      - name: Build HTML and export PDF
        # HTML は相対パス（--base ./）と hash ルーター（各スライドの routerMode: hash）にして，
        # どの URL に置いても，途中のスライドで再読み込みしても動くようにする
        run: |
          mkdir -p dist
          for file in *.md; do
            [ "$file" = README.md ] && continue
            deck="${file%.md}"
            npx slidev build "$file" --base ./ --out "dist/$deck"
            npx slidev export "$file" --output "dist/$deck.pdf"
          done
      - name: Index page
        run: |
          python3 - <<'EOF'
          import html, pathlib, re
          items = []
          for md in sorted(pathlib.Path(".").glob("*.md")):
              if md.name == "README.md":
                  continue
              m = re.search(r"^title: (.+)$", md.read_text(encoding="utf-8"), re.M)
              title = html.escape(m.group(1) if m else md.stem)
              items.append(f'<li>{title}（<a href="{md.stem}/">スライド</a>・<a href="{md.stem}.pdf">PDF</a>）</li>')
          pathlib.Path("dist/index.html").write_text(
              '<!doctype html><html lang="ja"><meta charset="utf-8"><title>説明用スライド</title>'
              '<h1>説明用スライド</h1><ul>' + "".join(items) + '</ul></html>\n', encoding="utf-8")
          EOF
      - uses: actions/upload-artifact@v4
        with:
          name: slides
          path: slides/dist
      - name: Upload for GitHub Pages
        if: vars.SLIDES_PAGES == 'true' && github.ref == 'refs/heads/ta' && github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v3
        with:
          path: slides/dist

  deploy:
    needs: build
    if: vars.SLIDES_PAGES == 'true' && github.ref == 'refs/heads/ta' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
